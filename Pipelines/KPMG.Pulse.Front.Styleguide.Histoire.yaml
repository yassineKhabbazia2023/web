trigger:
  - develop
  - release/*

pool:
  vmImage: 'windows-latest'

parameters:
- name: devIndex
  type: number
  default: 0
- name: deployType
  displayName: "Technical parameter : don t modify it !"
  type: string
  default: 'standard'
# REC Iteration
- name: RECiterations
  type: object
  displayName: "Technical parameter : don t modify it !"
  default:
  - 1
  - 2
  - 3

resources:
  repositories:
  - repository: CICD
    name: 'Plateforme Technologique/CICD'
    type: git
    ref: 'refs/heads/Release/v6.1'

extends:
  template: PipelineTemplate.yaml@CICD
  parameters:
    disableTelemetry: true
    versioning:
      mode: legacy
      major: 1
    build:
      sonarQube:
        projectKey: KPMGPulse_Front_StyleGuide
        projectName: "(KPMG Pulse)[Front] MFE StyleGuide (Pégase)"
        qualityGateName: "[Pulse] Default"
        sonarExclusions: '**/color.ts,**/pulse-icon-gen.js,**/*.story.vue,**/guidelines/**'
      tooling:
        nodejs: '18.18'
      steps:
      - type: npm
        name: Mfe_StyleGuide
        src: $(Build.SourcesDirectory)
        useCi: true
        preBuildCmd:
        - license
        - lint
        cmd: story:build
        test:
          resultPath: $(Build.SourcesDirectory)/coverage/cobertura-coverage.xml
        publishFeed:
          feedName: Constellation/PlateformePulse
          packageName: front-mfe-StyleGuide
          description: |
            MFE StyleGuide v$(GitVersion.number)
    deploy:
      environments:
      - ${{ if and(ne(parameters.devIndex, 0), ne(parameters.deployType, 'developToRec')) }}:
        - name: DEV
          displayName: Developpement
          ${{ if lt(parameters.devIndex, 10) }}:
            poolAgent: Pulse-dev0${{ parameters.devIndex }}
          ${{ else }}:
            poolAgent: Pulse-dev${{ parameters.devIndex }}
          condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
          variables:
          - name: azureSC
            value: PULSE-DEV
          - ${{ if lt(parameters.devIndex, 10) }}:
            - name: storageAccount
              value: frdev0${{ parameters.devIndex }}frontsa01platform
            - name: cdn_resourcegroup
              value: frdev0${{ parameters.devIndex }}hub
            - name: cdn_profile
              value: frdev0${{ parameters.devIndex }}hubafd01profile
            - name: cdn_endpoint
              value: histoire-dev0${{ parameters.devIndex }}
          - ${{ else }}:
            - name: storageAccount
              value: frdev${{ parameters.devIndex }}frontsa01platform
            - name: cdn_resourcegroup
              value: frdev${{ parameters.devIndex }}hub
            - name: cdn_profile
              value: frdev${{ parameters.devIndex }}hubafd01profile
            - name: cdn_endpoint
              value: histoire-dev${{ parameters.devIndex }}
      - ${{ if and(contains(variables['Build.SourceBranch'], 'develop'), ne(parameters.deployType, 'onlyDev')) }}:
        - name: ITG
          displayName: Intégration
          poolAgent: Pulse-itg01
          condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
          variables:
          - name: azureSC
            value: PULSE-ITG
          - name: storageAccount
            value: fritg01frontsa01platform
          - name: cdn_resourcegroup
            value: fritg01hub
          - name: cdn_profile
            value: fritg01hubafd01profile
          - name: cdn_endpoint
            value: histoire-itg01
      - ${{ if and(or(contains(variables['Build.SourceBranch'], 'release'), contains(variables['Build.SourceBranch'], 'hotfix')), ne(parameters.deployType, 'onlyDev')) }}:
        - ${{ each index in parameters.RECiterations }}:
          - name: REC${{ index }}
            displayName: Recette-rec0${{ index }}
            poolAgent: Pulse-rec0${{ index }}
            ${{ if eq(parameters.devIndex, 0) }}:
              dependsOn: Build
            ${{ else }}:
              dependsOn: DEV
            variables:
            - name: hubEnvironment
              value: rec0${{ index }}
            - name: azureSC
              value: PULSE-REC
            - name: storageAccount
              value: fr$(hubEnvironment)frontsa01platform
            - name: cdn_resourcegroup
              value: fr$(hubEnvironment)hub
            - name: cdn_profile
              value: fr$(hubEnvironment)hubafd01profile
            - name: cdn_endpoint
              value: histoire-$(hubEnvironment)
      steps:
      - type: az-blob
        name: Deploy_Mfe_Styleguide
        artifact: Mfe_StyleGuide
        azureServiceConnection: $(azureSC)
        storageAccount: $(storageAccount)
        container: "$web"
        targetPath: histoire
        storageDeployment: overwrite
        purgeCdn:
          resourceGroup: $(cdn_resourceGroup)
          profileName: $(cdn_profile)
          endpointName: $(cdn_endpoint)
          waitForCommand: true
          path: '/'
          type: AFD
