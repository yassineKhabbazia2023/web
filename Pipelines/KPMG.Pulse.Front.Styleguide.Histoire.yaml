trigger:
  - develop
  - release/*

pool:
  vmImage: 'windows-latest'

resources:
  repositories:
  - repository: CICD
    name: 'Plateforme Technologique/CICD'
    type: git
    ref: 'refs/heads/hotfix/clearcdn-path'


extends:
  template: PipelineTemplate.yaml@CICD
  parameters:
    versioning:
      mode: legacy
      major: 1
    build:
      sonarQube:
        projectKey: KPMGPulse_Front_StyleGuide
        projectName: "(KPMG Pulse)[Front] MFE StyleGuide (Pégase)"
        qualityGateName: "[Pulse] Default"
      steps:
      - type: npm
        name: Mfe_StyleGuide
        src: $(Build.SourcesDirectory)
        useCi: true
        preBuildCmd:
        - license
        - lint
        cmd: story:build
        test:
          resultPath: $(Build.SourcesDirectory)/test-report.xml
        publishFeed:
          feedName: Constellation/PlateformePulse
          packageName: front-mfe-StyleGuide
          description: |
            MFE StyleGuide v$(GitVersion.number)
    deploy:
      environments:
      - name: DEV
        displayName: Developpement
        condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
        variables:
        - name: azureSC
          value: DEV-MyPulseV2
        - name: storageAccount
          value: stpltpulsedevew001
        - name: cdn_resourcegroup
          value: rg-plateformepulse-dev-ew1-001
        - name: cdn_profile
          value: plateformepulse
        - name: cdn_endpoint
          value: sthistoiredevew001
      - name: Pre_REC
        displayName: Recette
        condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
        variables:
        - name: azureSC
          value: REC-MyPulseV2
        - name: storageAccount
          value: dumb
        - name: cdn_resourcegroup
          value: frapprecmypulse0001
        - name: cdn_profile
          value: mypulsev2rec
        - name: cdn_endpoint
          value: cdn-rec-pulse
      - name: PREPROD
        displayName: Preproduction
        condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
        variables:
        - name: azureSC
          value: PPR-MyPulseV2
        - name: storageAccount
          value: dumb
        - name: cdn_resourcegroup
          value: frapppprmypulse0001
        - name: cdn_profile
          value: mypulsebeta
        - name: cdn_endpoint
          value: cdn-ppr-pulse
      - name: PROD
        displayName: Production
        condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
        variables:
        - name: azureSC
          value: PRD-MyPulseV2
        - name: storageAccount
          value: dumb
        - name: cdn_resourcegroup
          value: frappprdmypulse0001
        - name: cdn_profile
          value: mypulse
        - name: cdn_endpoint
          value: cdn-prd-pulse
      steps:
      - type: az-blob
        name: Deploy_Mfe_Styleguide
        artifact: Mfe_Styleguide
        azureServiceConnection: $(azureSC)
        storageAccount: $(storageAccount)
        container: "$web"
        targetPath: histoire
        storageDeployment: overwrite
        purgeCdn:
          resourceGroup: $(cdn_resourceGroup)
          profileName: $(cdn_profile)
          endpointName: $(cdn_endpoint)
          waitForCommand: true
          path: '/'
