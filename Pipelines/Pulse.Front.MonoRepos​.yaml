trigger:
  - main

pool:
  vmImage: 'windows-latest'

parameters:
- name: devIndex
  type: number
  default: 0
- name: deployType
  displayName: "Technical parameter : don t modify it !"
  type: string
  default: 'onlyDev'
  values:
    - standard
    - onlyDev
- name: squad
  type: string
  default: 'none'
  values:
    - none
    - transverse
    - hades
    - hermes
    - orion

resources:
  repositories:
  - repository: Pulse
    name: 'Pulse.Operations.Pipelines'
    type: git
    ref: 'Release/v3.0'

extends:
  template: pipelines/templates/platform.front.monop.yaml@Pulse
  parameters:
    deployType: ${{ parameters.deployType }}
    devIndex: ${{ parameters.devIndex }}
    squad: ${{ parameters.squad }}
    sonarExclusions: '**/Mock.js,**/mocks/**,src/main.ts,src/main.mts,stryker/**.*, vitest.setup.ts'

