trigger:
  - develop
  - release/*

pool:
  vmImage: 'windows-latest'

parameters:
- name: devIndex
  type: number
  default: 0
- name: disableSonar
  displayName: "Désactiver Sonar"
  type: boolean
  default: false
  values:
    - true
    - false
- name: deployType
  displayName: "Technical parameter : don t modify it !"
  type: string
  default: 'onlyDev'
  values:
    - standard
    - onlyDev


resources:
  repositories:
  - repository: Pulse
    name: 'Pulse.Operations.Pipelines'
    type: git
    ref: 'refs/heads/Release/v2.3'

extends:
  template: pipelines/templates/platform.front.monop.yaml@Pulse
  parameters:
    deployType: ${{ parameters.deployType }}
    devIndex: ${{ parameters.devIndex }}
    sonarExclusions: '**/Mock.js,**/mocks/**,src/main.ts,src/main.mts,stryker/**.*, vitest.setup.ts'

