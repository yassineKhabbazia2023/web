parameters:
- name: devIndex
  type: number
  default: 0
- name: deployType
  type: string
  default: 'standard'
# REC Iteration
- name: recIterations
  type: object
  default:
  - 1
  - 2
# PRD Iteration
- name: prdIterations
  type: object
  default:
  - 1
  - 2

stages:
- stage: build
  displayName: 'Build'
  jobs:
  - job: build
    displayName: 'Build'
    steps:
    - publish: $(Build.SourcesDirectory)/pipelines
      artifact: Module
- ${{ if and(ne(parameters.devIndex, 0), ne(parameters.deployType, 'developToRec')) }}:
  - stage: deploy_DEV
    ${{ if lt(parameters.devIndex, 10) }}:
      displayName: 'Development-dev0${{ parameters.devIndex }}'
      pool: Pulse-dev0${{ parameters.devIndex }}
    ${{ else }}:
      displayName: 'Development-dev${{ parameters.devIndex }}'
      pool: Pulse-dev${{ parameters.devIndex }}
    jobs:
    - deployment: deploy
      displayName: 'Updating MONOROP in DEV env'
      environment: DEV
      strategy:
        runOnce:
          deploy:
            steps:
            - download: current
              artifact: Module

            - template: update-environment.yaml
              parameters:
                ${{ if lt(parameters.devIndex, 10) }}:
                  environment: dev0${{ parameters.devIndex }}
                ${{ else }}:
                  environment: dev${{ parameters.devIndex }}
                subscription: PULSE-DEV
- ${{ if and(contains(variables['Build.SourceBranch'], 'develop'), eq(parameters.deployType, 'standard')) }}:
  - stage: deploy_ITG
    displayName: 'Integration'
    pool: Pulse-itg01
    jobs:
    - deployment: deploy
      displayName: 'Updating Monorop develop'
      environment: ITG
      strategy:
        runOnce:
          deploy:
            steps:
            - download: current
              artifact: Module

            - template: update-environment.yaml
              parameters:
                environment: itg01
                subscription: PULSE-ITG
- ${{ if and(or(contains(variables['Build.SourceBranch'], 'release'), contains(variables['Build.SourceBranch'], 'hotfix')), ne(parameters.deployType, 'onlyDev')) }}:
  - ${{ each index in parameters.recIterations }}:
    - stage: deploy_REC${{ index }}
      displayName: Recette-rec0${{ index }}
      pool: Pulse-rec0${{ index }}
      ${{ if eq(parameters.devIndex, 0) }}:
        dependsOn: Build
      ${{ else }}:
        dependsOn: deploy_DEV
      jobs:
      - deployment: deploy
        displayName: 'Updating REC${{ index }} Monorop'
        environment: REC${{ index }}
        variables:
        - name: hubEnvironment
          value: rec0${{ index }}
        strategy:
          runOnce:
            deploy:
              steps:
              - download: current
                artifact: Module

              - template: update-environment.yaml
                parameters:
                  environment: $(hubEnvironment)
                  subscription: PULSE-REC
  - stage: deploy_PPR1
    displayName: Preproduction-ppr01
    pool: Pulse-ppr01
    dependsOn:
    - deploy_REC1
    jobs:
    - deployment: deploy
      displayName: 'Updating Monorop J-1 main'
      environment: PPR1
      variables:
      - name: hubEnvironment
        value: ppr01
      strategy:
        runOnce:
          deploy:
            steps:
            - download: current
              artifact: Module

            - template: update-environment.yaml
              parameters:
                environment: $(hubEnvironment)
                subscription: PULSE-PPR
  - ${{ each index in parameters.prdIterations }}:
    - stage: deploy_PRD${{ index }}
      displayName: Production-prd0${{ index }}
      pool: Pulse-prd0${{ index }}
      dependsOn:
      - deploy_PPR1
      jobs:
      - deployment: deploy
        displayName: 'Updating Monorop PRD${{ index }} main'
        environment: PRD${{ index }}
        variables:
        - name: hubEnvironment
          value: prd0${{ index }}
        strategy:
          runOnce:
            deploy:
              steps:
              - download: current
                artifact: Module

              - template: update-environment.yaml
                parameters:
                  environment: $(hubEnvironment)
                  subscription: PULSE-PRD
