
parameters:
- name: path
  type: string
  default: ' '
- name: environment
  type: string
- name: subscription
  type: string
  default: 'PULSE-DEV'

steps:
- task: AzureCLI@2
  displayName: "Updating env-vars.js for ${{ coalesce(parameters.path, 'main') }} front"
  inputs:
    azureSubscription: ${{ parameters.subscription }}
    scriptType: pscore
    scriptLocation: inlineScript
    inlineScript: |
      Import-Module $Env:PIPELINE_WORKSPACE/Module/Kpmg.Pulse.Deployment

      Write-Host 'Creating env-vars.js file'
      Set-EnvironmentVariables -Environment ${{ parameters.environment }} -Path '${{ parameters.path }}'
      
      Write-Host 'Set cache control for shell'
      Set-CacheControl -Environment ${{ parameters.environment }}

      Write-Host 'Cleaning old MFE versions'
      Remove-OldVersions -Environment ${{ parameters.environment }} -Path '${{ parameters.path }}'

      $env = Get-AdoEnvironment -Environment ${{ parameters.environment }} -Path $Path

      Write-Host 'Purging Azure Front Door'
      az afd endpoint purge --resource-group $env.cdnGroup --profile-name $env.cdnProfile --endpoint-name $env.cdnEndpoint --content-path '/env-vars.js' --domains $env.cdnDomain