name: $(Date:yyyyMMdd)$(Rev:.r)-$(SourceBranchName)

trigger: none

pool:
  vmImage: windows-latest

parameters:
- name: devIndex
  displayName: "Environment Index : 0 to 99"
  type: number
  default: 0
- name: deployType
  displayName: "Technical parameter : don t modify it !"
  type: string
  default: 'standard'

stages:
- template: templates/update-shell.yaml
  parameters:
    devIndex: ${{ parameters.devIndex }}
    deployType: ${{ parameters.deployType }}
