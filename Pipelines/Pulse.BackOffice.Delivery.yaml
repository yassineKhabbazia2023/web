trigger:
- main

parameters:
- name: deployToDev
  displayName: 'Déployer sur DEV'
  type: boolean
  default: false
- name: deployToItg
  displayName: 'Déployer sur ITG'
  type: boolean
  default: false
- name: deployToRec
  displayName: 'Déployer sur REC'
  type: boolean
  default: false
- name: deployToPrd
  displayName: 'Déployer sur PRD'
  type: boolean
  default: false

pool:
  vmImage: 'ubuntu-latest'

resources:
  repositories:
  - repository: Pulse
    name: 'Pulse.Operations.Pipelines'
    type: git
    ref: 'Release/v4.0'

extends:
  template: pipelines/delivery/backoffice.yaml@Pulse
  parameters:
    deployToDev: ${{ parameters.deployToDev }}
    deployToItg: ${{ parameters.deployToItg }}
    deployToRec: ${{ parameters.deployToRec }}
    deployToPrd: ${{ parameters.deployToPrd }}
