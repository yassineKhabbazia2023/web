trigger:
  - main
  - feature/*
  - bugfix/*
  - hotfix/* 

pool:
  vmImage: 'windows-latest'

parameters:
- name: devIndex
  type: number
  default: 0
- name: deployType
  displayName: "Technical parameter : don t modify it !"
  type: string
  default: 'onlyDev'
  values:
    - standard
    - onlyDev

resources:
  repositories:
  - repository: Pulse
    name: 'Pulse.Operations.Pipelines'
    type: git
    ref: 'Release/v3.0'

extends:
  template: pipelines/templates/platform.front.Assets.yaml@Pulse
  parameters:
    deployType: ${{ parameters.deployType }}
    devIndex: ${{ parameters.devIndex }}
    styleGuideFolder: 'packages/libraries/styleguide'

