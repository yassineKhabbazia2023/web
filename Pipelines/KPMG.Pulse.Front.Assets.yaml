name: $(TeamProject)_$(Build.DefinitionName)_$(SourceBranchName)_$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
    - main
    - develop
    - release/*
  paths:
    include:
    - src/assets/images

pool:
  vmImage: windows-latest

resources:
  repositories:
  - repository: CICD
    name: 'Plateforme Technologique/CICD'
    type: git
    ref: 'refs/heads/hotfix/clearcdn-path'

extends:
  template: PipelineTemplate.yaml@CICD
  parameters:
    versioning:
      mode: legacy
      major: 1
    build:
      sonarQube:
        projectKey: KPMGPulse_Front_StyleGuide
        projectName: "(KPMG Pulse)[Front] Styleguide (Pégase)"
        qualityGateName: "[Pulse] Default"
      steps:
      - type: files
        name: Assets
        path: src/assets/images
    deploy:
      environments:
      - name: DEV
        displayName: Developpement
        condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
        variables:
        - name: azureSC
          value: DEV-MyPulseV2
        - name: storageAccount
          value: sastdportalfront
        - name: cdn_resourcegroup
          value: rg-mypulse-v2-dev
        - name: cdn_profile
          value: myplusems
        - name: cdn_endpoint
          value: cdn-d2-pulse
      - name: REC
        displayName: Recette
        condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
        variables:
        - name: azureSC
          value: REC-MyPulseV2
        - name: storageAccount
          value: frappfrontrec
        - name: cdn_resourcegroup
          value: frapprecmypulse0001
        - name: cdn_profile
          value: mypulsev2rec
        - name: cdn_endpoint
          value: cdn-rec-pulse
      - name: PREPROD
        displayName: Preproduction
        condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
        variables:
        - name: azureSC
          value: PPR-MyPulseV2
        - name: storageAccount
          value: frappfrontppr
        - name: cdn_resourcegroup
          value: frapppprmypulse0001
        - name: cdn_profile
          value: mypulsebeta
        - name: cdn_endpoint
          value: cdn-ppr-pulse
      - name: PROD
        displayName: Production
        condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
        variables:
        - name: azureSC
          value: PRD-MyPulseV2
        - name: storageAccount
          value: frappfrontprod
        - name: cdn_resourcegroup
          value: frappprdmypulse0001
        - name: cdn_profile
          value: mypulse
        - name: cdn_endpoint
          value: cdn-prd-pulse
      steps:
      - type: az-blob
        name: Deploy_Assets
        artifact: Assets
        azureServiceConnection: $(azureSC)
        storageAccount: $(storageAccount)
        container: "assets"
        storageDeployment: overwrite
        purgeCdn:
          resourceGroup: $(cdn_resourceGroup)
          profileName: $(cdn_profile)
          endpointName: $(cdn_endpoint)
          waitForCommand: true
