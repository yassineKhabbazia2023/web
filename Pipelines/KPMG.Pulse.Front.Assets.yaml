name: $(TeamProject)_$(Build.DefinitionName)_$(SourceBranchName)_$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
    - main
    - develop
    - release/*
  paths:
    include:
    - src/assets/images

pool:
  vmImage: windows-latest

parameters:
- name: devIndex
  type: number
  default: 0
- name: deployType
  displayName: "Technical parameter : don t modify it !"
  type: string
  default: 'standard'

resources:
  repositories:
  - repository: CICD
    name: 'Plateforme Technologique/CICD'
    type: git
    ref: 'refs/heads/Release/v6.1'

extends:
  template: PipelineTemplate.yaml@CICD
  parameters:
    disableTelemetry: true
    versioning:
      mode: legacy
      major: 1
    build:
      sonarQube:
        projectKey: KPMGPulse_Front_StyleGuide
        projectName: "(KPMG Pulse)[Front] Styleguide (Pégase)"
        qualityGateName: "[Pulse] Default"
      steps:
      - type: files
        name: Assets
        path: src/assets/images
      - type: files
        name: Fonts
        path: src/assets/fonts
    deploy:
      environments:
      - ${{ if and(ne(parameters.devIndex, 0), ne(parameters.deployType, 'developToRec')) }}:
        - name: DEV
          condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
          ${{ if lt(parameters.devIndex, 10) }}:
            displayName: dev0${{ parameters.devIndex }}
            poolAgent: Pulse-dev0${{ parameters.devIndex }}
          ${{ else }}:
            displayName: dev${{ parameters.devIndex }}
            poolAgent: Pulse-dev${{ parameters.devIndex }}
          variables:
          - name: azureSC
            value: PULSE-DEV
          - ${{ if lt(parameters.devIndex, 10) }}:
            - name: storageAccount
              value: frdev0${{ parameters.devIndex }}frontsa01platform
            - name: cdn_resourcegroup
              value: frdev0${{ parameters.devIndex }}hub
            - name: cdn_profile
              value: frdev0${{ parameters.devIndex }}hubafd01profile
            - name: cdn_endpoint
              value: assets-dev0${{ parameters.devIndex }}
          - ${{ else }}:
            - name: storageAccount
              value: frdev${{ parameters.devIndex }}frontsa01platform
            - name: cdn_resourcegroup
              value: frdev${{ parameters.devIndex }}hub
            - name: cdn_profile
              value: frdev${{ parameters.devIndex }}hubafd01profile
            - name: cdn_endpoint
              value: assets-dev${{ parameters.devIndex }}
      - ${{ if and(contains(variables['Build.SourceBranch'], 'develop'), eq(parameters.deployType, 'standard')) }}:
        - name: ITG
          displayName: Integration
          condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
          poolAgent: Pulse-itg01
          variables:
          - name: azureSC
            value: PULSE-ITG
          - name: storageAccount
            value: fritg01frontsa01platform
          - name: cdn_resourcegroup
            value: fritg01hub
          - name: cdn_profile
            value: fritg01hubafd01profile
          - name: cdn_endpoint
            value: assets-itg01
      - ${{ if or(and(or(contains(variables['Build.SourceBranch'], 'release'), contains(variables['Build.SourceBranch'], 'hotfix')), ne(parameters.deployType, 'onlyDev')), and(contains(variables['Build.SourceBranch'], 'develop'), eq(parameters.deployType, 'developToRec'))) }}:
        - name: REC
          displayName: Recette
          condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
          poolAgent: Pulse-rec01
          variables:
          - name: azureSC
            value: PULSE-REC
          - name: storageAccount
            value: frrec01frontsa01platform
          - name: cdn_resourcegroup
            value: frrec01hub
          - name: cdn_profile
            value: frrec01hubafd01profile
          - name: cdn_endpoint
            value: assets-rec01
      steps:
      - type: az-blob
        name: Deploy_Assets
        artifact: Assets
        azureServiceConnection: $(azureSC)
        storageAccount: $(storageAccount)
        container: "$web"
        targetPath: assets
        storageDeployment: overwrite
        purgeCdn:
          resourceGroup: $(cdn_resourceGroup)
          profileName: $(cdn_profile)
          endpointName: $(cdn_endpoint)
          waitForCommand: true
          path: '/'
          type: AFD
      - type: az-blob
        name: Deploy_Fonts
        artifact: Fonts
        azureServiceConnection: $(azureSC)
        storageAccount: $(storageAccount)
        container: "$web"
        targetPath: assets/fonts
        storageDeployment: overwrite
        purgeCdn:
          resourceGroup: $(cdn_resourceGroup)
          profileName: $(cdn_profile)
          endpointName: $(cdn_endpoint)
          waitForCommand: true
          path: 'fonts'
          type: AFD
