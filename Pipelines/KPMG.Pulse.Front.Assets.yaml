name: $(TeamProject)_$(Build.DefinitionName)_$(SourceBranchName)_$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
    - main
    - develop
    - release/*
  paths:
    include:
    - src/assets/images

pool:
  vmImage: windows-latest

parameters:
- name: devIndex
  type: number
  default: 0

resources:
  repositories:
  - repository: CICD
    name: 'Plateforme Technologique/CICD'
    type: git
    ref: 'refs/heads/Release/v6.0'

extends:
  template: PipelineTemplate.yaml@CICD
  parameters:
    versioning:
      mode: legacy
      major: 1
    build:
      sonarQube:
        projectKey: KPMGPulse_Front_StyleGuide
        projectName: "(KPMG Pulse)[Front] Styleguide (Pégase)"
        qualityGateName: "[Pulse] Default"
      steps:
      - type: files
        name: Assets
        path: src/assets/images
    deploy:
      environments:
      - ${{ if ne(parameters.devIndex, 0) }}:
        - name: DEV
          displayName: Developpement
          condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
          ${{ if lt(parameters.devIndex, 10) }}:
            poolAgent: Pulse-dev0${{ parameters.devIndex }}
          ${{ else }}:
            poolAgent: Pulse-dev${{ parameters.devIndex }}
          variables:
          - name: azureSC
            value: PULSE-DEV
          - ${{ if lt(parameters.devIndex, 10) }}:
            - name: storageAccount
              value: frdev0${{ parameters.devIndex }}frontsa01platform
          - ${{ else }}:
            - name: storageAccount
              value: frdev${{ parameters.devIndex }}frontsa01platform
          - name: cdn_resourcegroup
            value: frdevcommon
          - name: cdn_profile
            value: frdevcommoncdn01profile
          - ${{ if lt(parameters.devIndex, 10) }}:
            - name: cdn_endpoint
              value: assets-dev0${{ parameters.devIndex }}
          - ${{ else }}:
            - name: cdn_endpoint
              value: assets-dev${{ parameters.devIndex }}
      - ${{ if contains(variables['Build.SourceBranch'], 'develop') }}:
        - name: ITG
          displayName: Integration
          condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
          poolAgent: Pulse-itg01
          variables:
          - name: azureSC
            value: PULSE-ITG
          - name: storageAccount
            value: fritg01frontsa01platform
          - name: cdn_resourcegroup
            value: fritgcommon
          - name: cdn_profile
            value: fritgcommoncdn01profile
          - name: cdn_endpoint
            value: assets-itg01
      - ${{ if or(contains(variables['Build.SourceBranch'], 'release'), contains(variables['Build.SourceBranch'], 'hotfix')) }}:
        - name: REC
          displayName: Recette
          condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
          poolAgent: Pulse-rec01
          variables:
          - name: azureSC
            value: PULSE-REC
          - name: storageAccount
            value: frrec01frontsa01platform
          - name: cdn_resourcegroup
            value: frreccommon
          - name: cdn_profile
            value: frreccommoncdn01profile
          - name: cdn_endpoint
            value: assets-rec01
      steps:
      - type: az-blob
        name: Deploy_Assets
        artifact: Assets
        azureServiceConnection: $(azureSC)
        storageAccount: $(storageAccount)
        container: "$web"
        targetPath: assets
        storageDeployment: overwrite
        purgeCdn:
          resourceGroup: $(cdn_resourceGroup)
          profileName: $(cdn_profile)
          endpointName: $(cdn_endpoint)
          waitForCommand: true
          path: '/'
          type: AFD
