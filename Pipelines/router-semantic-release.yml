# This YAML configuration installs Node.js, installs project dependencies, builds the project, and then executes the semantic-release command.

trigger:
  - develop

pool:
  vmImage: 'windows-latest'

steps:
  - checkout: self

  - task: NodeTool@0
    inputs:
      versionSpec: '18.x'
    displayName: 'Install Node.js'
  
  - script: npm install
    displayName: 'Install Dependencies'

  - script: npx semantic-release
    env:
      GITHUB_TOKEN: $(GITHUB_TOKEN)
    displayName: 'Semantic Release'