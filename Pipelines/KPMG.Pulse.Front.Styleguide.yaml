# This YAML configuration installs Node.js, installs project dependencies, builds the project.

trigger:
  - develop
  - release/*

pool:
  vmImage: 'windows-latest'

resources:
  repositories:
  - repository: Pulse
    name: 'Constellation/ConstellationDevOps'
    type: git
    ref: 'refs/heads/features/tpme'

extends:
  template: pipelines/templates/platform.front.package.yaml@Pulse
  parameters:
    packageName: Styleguide
    sonarExclusions: '**/color.ts,**/pulse-icon-gen.js,**/*.story.vue,**/guidelines/**'
    versioning:
      mode: legacy
      major: 2
      minor: 2