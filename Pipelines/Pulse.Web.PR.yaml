trigger: none

pool:
  vmImage: 'ubuntu-latest'

resources:
  repositories:
  - repository: Pulse
    name: 'Pulse.Operations.Pipelines'
    type: git
    ref: 'Release/v4.0'

extends:
  template: pipelines/pull-request/web.yaml@Pulse
  parameters:
    buildType: 'PullRequest Validation'
    buildName: 'Pulse_Web_PR'
    buildDescription: 'Build and deploy Pulse Web for PRs'