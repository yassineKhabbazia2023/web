schedules:
- cron: '0 7 * * 1-5'
  displayName: 'Daily 7 AM UTC (8h hiver CET / 9h été CEST)'
  branches:
    include:
    - main
  always: true

trigger: none

pool:
  vmImage: 'ubuntu-latest'

variables:
  npmCacheFolder: $(Agent.HomeDirectory)/.npm
  branchName: 'fix/npm-audit-fix-$(Build.BuildId)'

stages:
- stage: AuditFix
  displayName: 'Npm Audit Fix'
  condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')
  jobs:
  - job: RunAuditFix
    displayName: 'Run npm audit fix'
    steps:
    - checkout: self

    - task: UseNode@1
      inputs:
        version: '24.x'
      displayName: 'Install Node.js'

    - task: Cache@2
      inputs:
        key: 'npm | "$(Agent.OS)" | package-lock.json'
        restoreKeys: |
          npm | "$(Agent.OS)"
        path: $(npmCacheFolder)
      displayName: 'Cache npm packages'

    - script: npm ci --cache=$(npmCacheFolder)
      displayName: 'Install dependencies'

    - script: |
        mkdir -p $(Build.ArtifactStagingDirectory)/audit
        echo "Capturing audit report before fix..."
        npm audit --json > $(Build.ArtifactStagingDirectory)/audit/audit-before.json || true
        echo "Running npm audit fix..."
        npm audit fix --min-release-age=0 || true
        echo "Audit fix completed (exit code ignored)"
        echo "Capturing audit report after fix..."
        npm audit --json > $(Build.ArtifactStagingDirectory)/audit/audit-after.json || true
      displayName: 'Run audit fix'

    - script: |
        changedFiles=$(git diff --name-only)
        if [ -n "$changedFiles" ]; then
          echo "Vulnerabilities have been patched:"
          echo "$changedFiles"
          echo "##vso[task.setvariable variable=hasChanges;isOutput=true]true"
        else
          echo "No vulnerabilities to fix."
          echo "##vso[task.setvariable variable=hasChanges;isOutput=true]false"
        fi
      name: detectChanges
      displayName: 'Detect changes'

    - script: |
        node - <<'NODE_SCRIPT'
        const fs = require('fs')
        const path = require('path')

        const auditDir = process.env.AUDIT_DIR

        const readAudit = (fileName) => {
          try {
            return JSON.parse(fs.readFileSync(path.join(auditDir, fileName), 'utf8'))
          } catch {
            return { vulnerabilities: {} }
          }
        }

        // Flatten npm audit v2 report into one entry per (package, advisory)
        const collectAdvisories = (audit) => {
          const advisories = new Map()
          for (const [packageName, info] of Object.entries(audit.vulnerabilities ?? {})) {
            for (const via of info.via ?? []) {
              if (typeof via !== 'object' || via === null) continue
              const url = via.url ?? ''
              const code = url.includes('github.com/advisories/') ? url.split('/').pop() : String(via.source ?? '')
              advisories.set(`${packageName}|${code}`, {
                packageName,
                severity: via.severity ?? '',
                code,
                title: via.title ?? '',
                range: via.range ?? '',
                url,
              })
            }
          }
          return advisories
        }

        const before = collectAdvisories(readAudit('audit-before.json'))
        const after = collectAdvisories(readAudit('audit-after.json'))
        const fixed = [...before.entries()]
          .filter(([key]) => after.has(key) === false)
          .map(([, advisory]) => advisory)

        const markdownEscape = (value) => String(value).replaceAll('|', '\\|')
        const lines = [
          '## 🔒 Npm audit fix automatique',
          '',
          'PR créée automatiquement par le pipeline quotidien `npm audit fix`.',
          '',
        ]
        if (fixed.length > 0) {
          lines.push(`### Vulnérabilités corrigées (${fixed.length})`, '')
          lines.push('| Paquet | Sévérité | Code | Advisory |')
          lines.push('|---|---|---|---|')
          for (const advisory of fixed) {
            const codeLink = advisory.url !== '' ? `[${advisory.code}](${advisory.url})` : advisory.code
            lines.push(`| \`${markdownEscape(advisory.packageName)}\` | ${advisory.severity} | ${codeLink} | ${markdownEscape(advisory.title)} |`)
          }
        } else {
          lines.push('Aucune advisory résolue identifiée par comparaison des rapports `npm audit` (mise à jour du lockfile uniquement).')
        }
        fs.writeFileSync(path.join(auditDir, 'pr-description.md'), lines.join('\n') + '\n')

        console.log(`Fixed advisories: ${fixed.length}`)
        NODE_SCRIPT
      condition: eq(variables['detectChanges.hasChanges'], 'true')
      env:
        AUDIT_DIR: $(Build.ArtifactStagingDirectory)/audit
      displayName: 'Generate PR description'

    - pwsh: |
        $base64AuthInfo = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes(("{0}:{1}" -f "user",$env:SYSTEM_ACCESSTOKEN)))
        $headers = @{Authorization=("Basic {0}" -f $base64AuthInfo)}
        $baseUrl = '$(System.CollectionUri)$(System.TeamProject)/_apis/git/repositories/$(Build.Repository.ID)'

        # Get source branch HEAD (main on schedule, chosen branch on manual run)
        $sourceBranch = '$(Build.SourceBranch)' -replace '^refs/heads/', ''
        $refsUrl = "$baseUrl/refs?filter=heads/$sourceBranch&api-version=7.1"
        $sourceRef = (Invoke-RestMethod -Uri $refsUrl -Headers $headers).value[0]
        $sourceCommitId = $sourceRef.objectId

        # Create branch from source branch
        $createRefUrl = "$baseUrl/refs?api-version=7.1"
        $refBody = ConvertTo-Json @(@{
            name        = 'refs/heads/$(branchName)'
            oldObjectId = '0000000000000000000000000000000000000000'
            newObjectId = $sourceCommitId
        })
        Invoke-RestMethod -Uri $createRefUrl -Headers $headers -Method Post -ContentType 'application/json' -Body $refBody

        # Build changes from git diff
        $changedFiles = (git diff --name-only) -split "`n" | Where-Object { $_.Trim() }
        $changes = @()
        foreach ($file in $changedFiles) {
            $bytes = [System.IO.File]::ReadAllBytes($file)
            $content = [Convert]::ToBase64String($bytes)
            $changes += @{
                changeType = 'edit'
                item       = @{ path = "/$file" }
                newContent = @{ content = $content; contentType = 'base64encoded' }
            }
        }

        # Push commit to new branch
        $pushUrl = "$baseUrl/pushes?api-version=7.1"
        $pushBody = @{
            refUpdates = @(@{
                name        = 'refs/heads/$(branchName)'
                oldObjectId = $sourceCommitId
            })
            commits = @(@{
                comment = 'fix(security): corriger les vulnérabilités npm (audit fix automatique)'
                changes = $changes
            })
        } | ConvertTo-Json -Depth 10

        Invoke-RestMethod -Uri $pushUrl -Headers $headers -Method Post -ContentType 'application/json' -Body $pushBody
      condition: eq(variables['detectChanges.hasChanges'], 'true')
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      displayName: 'Create branch and push changes'

    - pwsh: |
        $base64AuthInfo = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes(("{0}:{1}" -f "user",$env:SYSTEM_ACCESSTOKEN)))
        $headers = @{Authorization=("Basic {0}" -f $base64AuthInfo)}
        $url = '$(System.CollectionUri)$(System.TeamProject)/_apis/git/repositories/$(Build.Repository.ID)/pullrequests?api-version=7.1'

        $descriptionPath = '$(Build.ArtifactStagingDirectory)/audit/pr-description.md'
        $description = 'This PR is automatically created by the daily npm audit fix pipeline to patch detected vulnerabilities.'
        if (Test-Path $descriptionPath) {
          $description = Get-Content $descriptionPath -Raw
        }
        # Azure DevOps limits PR descriptions to 4000 characters
        if ($description.Length -gt 3900) {
          $description = $description.Substring(0, 3900) + "`n... (liste tronquée)"
        }

        $body = @{
          sourceRefName = 'refs/heads/$(branchName)'
          targetRefName = '$(Build.SourceBranch)'
          title         = 'fix(security): corriger les vulnérabilités npm (audit fix automatique)'
          description   = $description
          workItemRefs  = @(@{ id = '59819' })
        } | ConvertTo-Json -Depth 5

        Invoke-RestMethod -Uri $url -Headers $headers -Method Post -ContentType 'application/json' -Body $body
      condition: eq(variables['detectChanges.hasChanges'], 'true')
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      displayName: 'Create Pull Request'
